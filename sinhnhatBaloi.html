<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Thư Gửi Ba Lợi - 05.11.1988</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #120e0a;
            background-image: radial-gradient(circle at center, #2b2118 0%, #0d0a07 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            padding: 20px;
            position: relative;
        }

        /* Hiệu ứng hạt bụi vàng lơ lửng */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, #ffd700, transparent);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Màn hình Phong bì lúc đầu */
        .envelope-wrapper {
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            animation: hoverFloat 3s ease-in-out infinite;
        }
        @keyframes hoverFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .envelope {
            width: 300px;
            height: 200px;
            background: #d8c39e;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.25) 100%);
            border-radius: 6px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85), inset 0 0 30px rgba(107, 76, 35, 0.4);
            border: 1px solid #b59b6d;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        .envelope::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #c4ab80;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
            z-index: 2;
            transform-origin: top;
            transition: transform 0.6s ease;
        }
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
        }

        .wax-seal-btn {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 30% 30%, #b82527, #5e0b0d);
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.6);
            border: 2px dashed #d65a5c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f4ecd8;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            animation: pulseSeal 2s infinite;
            margin-top: 15px;
        }
        @keyframes pulseSeal {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(184, 37, 39, 0.7); }
            70% { transform: scale(1.06); box-shadow: 0 0 0 15px rgba(184, 37, 39, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(184, 37, 39, 0); }
        }
        .tap-hint {
            color: #d8c39e;
            margin-top: 22px;
            font-size: 14px;
            font-style: italic;
            letter-spacing: 0.5px;
            opacity: 0.85;
            animation: fadeBlink 2s infinite;
        }
        @keyframes fadeBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Tấm thiệp chính - Căn lề chuẩn cho màn hình điện thoại */
        .vintage-card {
            background-color: #e6d6ac;
            background-image: radial-gradient(circle at center, #efe2be 0%, #d8c394 100%);
            width: calc(100% - 28px);
            max-width: 420px;
            padding: 20px 16px;
            border-radius: 6px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 25px rgba(107, 76, 35, 0.25);
            border: 1px solid #c5b393;
            text-align: center;
            position: absolute;
            z-index: 5;
            opacity: 0;
            transform: translateY(60px) scale(0.85);
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .vintage-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        @keyframes cardShake {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(3px) scale(0.99) rotate(-0.5deg); }
            75% { transform: translateY(-2px) scale(1.01) rotate(0.5deg); }
        }
        .vintage-card.shake {
            animation: cardShake 0.3s ease-in-out;
        }

        .inner-border {
            border-left: 3px double #634729;
            border-right: 3px double #634729;
            padding: 24px 12px 20px;
            position: relative;
        }
        .border-cap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: absolute;
            left: 0;
        }
        .border-cap.top { top: -11px; }
        .border-cap.bottom { bottom: -11px; }
        .border-cap::before, .border-cap::after {
            content: "";
            flex: 1;
            border-top: 3px double #634729;
        }
        .border-cap span {
            padding: 0 10px;
            color: #634729;
            font-size: 20px;
            line-height: 1;
        }
        .border-cap.bottom span {
            transform: rotate(180deg);
        }

        .header-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(30px, 8vw, 36px);
            color: #7a2021;
            margin-bottom: 4px;
        }
        .sub-date {
            font-size: 12px;
            color: #6e5536;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #8c6d46, transparent);
            margin: 12px auto;
            width: 85%;
        }

        /* BỐ CỤC VĂN BẢN TỐI ƯU CHO MÀN HÌNH DỌC IPHONE */
        .message-box {
            min-height: 225px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 10px 0;
            color: #2c1d11;
        }
        .line-intro {
            font-size: clamp(13.5px, 3.7vw, 15px);
            font-style: italic;
            color: #5a4228;
            margin-bottom: 12px;
            line-height: 1.55;
        }
        .line-body {
            font-size: clamp(15.5px, 4.2vw, 18px);
            font-weight: 700;
            line-height: 1.68;
            color: #24170c;
            margin-bottom: 14px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .line-punchline {
            font-size: clamp(15px, 4.1vw, 17px);
            font-style: italic;
            font-weight: 700;
            color: #7a2021;
            margin-top: 2px;
            padding-top: 12px;
            border-top: 1px dashed rgba(140, 109, 70, 0.5);
            display: inline-block;
            align-self: center;
            padding-left: 10px;
            padding-right: 10px;
            line-height: 1.45;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #7a2021;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Phần chân thư: Chữ ký & Con dấu */
        .footer-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 8px;
            height: 72px;
        }
        .signature {
            font-size: 14px;
            font-style: italic;
            color: #634729;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .signature.show {
            opacity: 1;
        }
        .stamp {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle, #9e2a2b, #6b1416);
            border-radius: 50%;
            color: #f4ecd8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10.5px;
            font-weight: bold;
            font-style: italic;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.5);
            border: 2px dashed #b84a4b;
            opacity: 0;
            transform: scale(3.5) rotate(-35deg);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.25;
            text-align: center;
        }
        .stamp.stamped {
            opacity: 1;
            transform: scale(1) rotate(-14deg);
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <!-- Bước 1: Phong bì thư cổ điển -->
    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openLetter()">
        <div class="envelope">
            <div class="wax-seal-btn">
                <span>KÍNH GỬI</span>
                <span style="font-size: 10px; font-weight: normal; margin-top: 3px;">BA LỢI</span>
            </div>
        </div>
        <div class="tap-hint">Chạm vào dấu sáp để mở mật thư gửi Ba Lợi...</div>
    </div>

    <!-- Bước 2: Nội dung bức thư -->
    <div class="vintage-card" id="vintageCard">
        <div class="inner-border">
            <div class="border-cap top"><span>❧</span></div>
            <div class="border-cap bottom"><span>❧</span></div>

            <div class="header-title">Mật Thư Gửi Ba Lợi</div>
            <div class="sub-date">05 • 11 • 1988</div>
            <div class="divider"></div>
            
            <div class="message-box">
                <div class="line-intro" id="line1"></div>
                <div class="line-body" id="line2"></div>
                <div class="line-punchline" id="line3" style="opacity: 0;"></div>
            </div>
            
            <div class="divider"></div>
            <div class="footer-area">
                <div class="signature" id="signature">— Vịt béo kính thư —</div>
                <div class="stamp" id="stamp">
                    <span style="font-size: 8px; font-weight: normal;">CHỨNG NHẬN</span>
                    <span>PHONG ĐỘ</span>
                    <span style="font-size: 9px;">MÃI TUỔI 18</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tạo hạt bụi vàng
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 28; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 5 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 4}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }

        // Chia nhịp dòng chuẩn xác theo đúng lời chúc bạn chọn
        const steps = [
            {
                el: 'line1',
                lines: [
                    'Kỷ niệm ngày qua, đón tuổi sang,',
                    'Thanh xuân còn mãi, chí thêm vàng.'
				
                ],
                delayAfter: 400
            },
            {
                el: 'line2',
                lines: [
                    "Mừng sinh nhật Ba Lợi dấu yêu!",
                    "Chúc Ba tuổi mới sức khỏe dồi dào,",
                    "Giữ vững sự tâm huyết, dí dỏm",
                    "Và mãi yêu thương sóc nhỏ thầy hen.",                  
                ],
                delayAfter: 650
            },
            {
                el: 'line3',
                lines: [
                    "Tuổi 38 nhưng giao diện",
                    "mãi tuổi 18 nha Ba =)))))"
                ],
                delayAfter: 300
            }
        ];

        let isOpened = false;

        function openLetter() {
            if (isOpened) return;
            isOpened = true;

            const env = document.getElementById('envelopeWrapper');
            const card = document.getElementById('vintageCard');

            env.classList.add('open');

            setTimeout(() => {
                env.style.opacity = '0';
                env.style.transform = 'scale(0.8) translateY(-40px)';
                env.style.pointerEvents = 'none';
                card.classList.add('show');
            }, 500);

            setTimeout(() => {
                runTypewriter(0, 0, 0);
            }, 1300);
        }

        function runTypewriter(stepIdx, lineIdx, charIdx) {
            if (stepIdx >= steps.length) {
                const oldCursor = document.getElementById('activeCursor');
                if (oldCursor) oldCursor.remove();

                setTimeout(() => {
                    document.getElementById('signature').classList.add('show');
                    document.getElementById('stamp').classList.add('stamped');
                    document.getElementById('vintageCard').classList.add('shake');
                }, 300);
                return;
            }

            const currentStep = steps[stepIdx];
            const container = document.getElementById(currentStep.el);
            container.style.opacity = '1';

            const currentLineText = currentStep.lines[lineIdx];

            if (charIdx === 0 && lineIdx > 0) {
                const oldCursor = document.getElementById('activeCursor');
                if (oldCursor) oldCursor.remove();
                container.innerHTML += '<br>';
            }

            let cursor = document.getElementById('activeCursor');
            if (!cursor) {
                cursor = document.createElement('span');
                cursor.id = 'activeCursor';
                cursor.className = 'cursor';
                container.appendChild(cursor);
            }

            if (charIdx < currentLineText.length) {
                const char = currentLineText.charAt(charIdx);
                cursor.insertAdjacentText('beforebegin', char);
                
                let speed = 38;
                if (char === ',' || char === ':' || char === '!' || char === '.') speed = 250;

                setTimeout(() => {
                    runTypewriter(stepIdx, lineIdx, charIdx + 1);
                }, speed);
            } else {
                if (lineIdx + 1 < currentStep.lines.length) {
                    setTimeout(() => {
                        runTypewriter(stepIdx, lineIdx + 1, 0);
                    }, 260);
                } else {
                    const oldCursor = document.getElementById('activeCursor');
                    if (oldCursor) oldCursor.remove();

                    setTimeout(() => {
                        runTypewriter(stepIdx + 1, 0, 0);
                    }, currentStep.delayAfter);
                }
            }
        }
    </script>
</body>
</html>
